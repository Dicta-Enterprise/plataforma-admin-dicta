<div class="login-fondo">
  <div class="login-tarjeta">
    <div class="login-logo">
      <span class="login-logo-texto">MUNDO<br />DICTARIANO</span>
    </div>

    <h1 class="login-titulo">Panel de administración</h1>

    <form class="login-form" (ngSubmit)="iniciarSesion()">
      <div class="login-campo">
        <label for="email">Correo</label>
        <input
          pInputText
          id="email"
          type="email"
          name="email"
          [(ngModel)]="email"
          placeholder="tu@correo.com"
          autocomplete="username"
        />
      </div>

      <div class="login-campo">
        <label for="password">Contraseña</label>
        <p-password
          inputId="password"
          name="password"
          [(ngModel)]="password"
          [feedback]="false"
          [toggleMask]="true"
          autocomplete="current-password"
          styleClass="login-password"
        />
      </div>

      @if (error) {
        <div class="login-error">{{ error }}</div>
      }

      <button pButton type="submit" label="Entrar" [loading]="cargando" class="login-boton"></button>
    </form>
  </div>
</div>
