<div class="flex justify-content-between flex-wrap mb-3">
  <div class="flex align-items-center mb-3 md:mb-0">
    <div class="text-900 font-bold text-3xl">LANDING PAGE</div>
  </div>

  <div>
    <button pButton label="Nueva landing" 
      (click)="nuevaLanding()">
    </button>
  </div>
</div>

  <div class="flex gap-3 mb-4 align-items-end">
    <div class="flex flex-column gap-1">
      <label class="text-sm font-medium">Categoría</label>
      <p-select
        [(ngModel)]="categoriaSeleccionada"
        [options]="categorias"
        optionLabel="nombre"
        placeholder="Seleccionar categoría"
        [showClear]="true"
        (onChange)="onCategoriaChange()"
        styleClass="w-15rem"
      />
    </div>

    <div class="flex flex-column gap-1">
      <label class="text-sm font-medium">Galaxia</label>
      <p-select
        [(ngModel)]="galaxiaSeleccionada"
        [options]="galaxias"
        optionLabel="nombre"
        placeholder="Seleccionar galaxia"
        [showClear]="true"
        [disabled]="!categoriaSeleccionada"
        (onChange)="onGalaxiaChange()"
        styleClass="w-15rem"
      />
    </div>

    <div class="flex flex-column gap-1">
      <label class="text-sm font-medium">Planeta</label>
      <p-select
        [(ngModel)]="planetaSeleccionado"
        [options]="planetas"
        optionLabel="nombre"
        placeholder="Seleccionar planeta"
        [showClear]="true"
        [disabled]="!galaxiaSeleccionada"
        (onChange)="onPlanetaChange()"
        styleClass="w-15rem"
      />
    </div>
  </div>

<p-table #dt [value]="landings" [paginator]="true" [rows]="10" [rowsPerPageOptions]="[10, 25, 50]"
  [globalFilterFields]="['titulo', 'descripcion', 'slug']" [tableStyle]="{ 'min-width': '70rem' }">
  <ng-template pTemplate="caption">
    <div class="flex gap-2 justify-content-end align-items-center">
      <p-select [options]="estados" optionLabel="label" optionValue="value" placeholder="Estado" [showClear]="true"
        styleClass="w-10rem" (onChange)="dt.filter($event.value, 'estado', 'equals')"></p-select>

      <p-iconfield iconPosition="left">
        <p-inputicon>
          <i class="pi pi-search"></i>
        </p-inputicon>
        <input pInputText type="text" (input)="dt.filterGlobal($any($event.target).value, 'contains')"
          placeholder="Buscar..." />
      </p-iconfield>
    </div>
  </ng-template>

  <ng-template pTemplate="header">
    <tr>
      <th>Titulo</th>
      <th>Descripcion</th>
      <th>Slug</th>
      <th>Estado</th>
      <th>Acciones</th>
    </tr>
  </ng-template>

  <ng-template pTemplate="body" let-landing>
    <tr>
      <td>{{ landing.titulo }}</td>
      <td>{{ landing.descripcion }}</td>
      <td>{{ landing.slug }}</td>
      <td>
        <p-tag [value]="landing.estado ? 'Activo' : 'No activo'" [severity]="getEstadoSeverity(landing.estado)"></p-tag>
      </td>
      <td class="flex gap-2">
        <button pButton type="button" icon="pi pi-pencil" class="p-button-text"
          (click)="editarLanding(landing)"></button>
        <button pButton type="button" icon="pi pi-trash" class="p-button-text p-button-danger"
          (click)="eliminarLanding(landing)"></button>
      </td>
    </tr>
  </ng-template>
</p-table>
